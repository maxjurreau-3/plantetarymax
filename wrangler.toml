name = "rpc-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
type = "javascript"

[durable_objects]
bindings = [
  { name = "BROKER_DO", class_name = "BrokerDO" },
  { name = "SUBSTRATE_DO", class_name = "SubstrateDO" }
]

[exports.BrokerDO]
type = "durable-object"
class_name = "BrokerDO"
storage = "sqlite"

[exports.SubstrateDO]
type = "durable-object"
class_name = "SubstrateDO"
storage = "sqlite"

[env.production]
account_id = "<YOUR_ACCOUNT_ID>"
